
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login EDUQ</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #eef; padding: 40px; }
    .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #003366; }
    input, button { width: 100%; padding: 10px; margin: 10px 0; }
    .msg { text-align: center; color: red; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Login Administrativo EDUQ</h2>
    <input type="email" id="email" placeholder="E-mail">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    <button onclick="cadastrar()">Cadastrar Novo Usuário</button>
    <div class="msg" id="mensagem"></div>
  </div>

  <script>
    const firebaseConfig = {
      // cole seu firebaseConfig aqui
    };
    firebase.initializeApp(firebaseConfig);

    function login() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      firebase.auth().signInWithEmailAndPassword(email, senha)
        .then(() => { window.location.href = 'painel_certificados_pdf.html'; })
        .catch(error => {
          document.getElementById('mensagem').innerText = 'Erro ao entrar: ' + error.message;
        });
    }

    function cadastrar() {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      firebase.auth().createUserWithEmailAndPassword(email, senha)
        .then(() => {
          document.getElementById('mensagem').innerText = 'Usuário cadastrado com sucesso!';
        })
        .catch(error => {
          document.getElementById('mensagem').innerText = 'Erro ao cadastrar: ' + error.message;
        });
    }
  </script>
</body>
</html>
